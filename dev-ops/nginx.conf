upstream lf-portal {
        ip_hash;
        server 192.168.0.10:6505;
        keepalive 64;
}

server {
    listen       443 ssl;
    ssl_certificate /etc/letsencrypt/live/lf-portal.developteam.net/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/lf-portal.developteam.net/privkey.pem;
    server_name  lf-portal.developteam.net;
    root         /usr/share/nginx/html;
    client_max_body_size 1000M;

  location / {
    proxy_pass                          http://lf-portal;
    proxy_http_version                  1.1;
    proxy_set_header  Connection        "";
    #proxy_set_header  Host              $host;
    proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header  X-Real-IP         $remote_addr;
    
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
    proxy_ssl_session_reuse off;
    proxy_redirect off;

  }

}

